
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModelGuardians Monitoring</title>
  <style>
    body {
      font-family: system-ui, Segoe UI, sans-serif;
      background: #111a27;
      color: #e7edf7;
      margin: 0;
      padding: 24px;
    }

    h1 { margin-top: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .card {
      background: #1a2636;
      border: 1px solid #2c3b50;
      border-radius: 12px;
      padding: 16px;
    }

    .metric {
      font-size: 28px;
      font-weight: 700;
    }

    .muted { color: #9eb0c8; }
    .critical { color: #ff8178; }
    .warning { color: #ffd166; }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event {
      border-top: 1px solid #2c3b50;
      padding: 12px 0;
    }

    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>ModelGuardians</h1>

  <p class="muted">
    Monitoring and alert prototype. Refreshes every 5 seconds.
  </p>

  <div class="grid">
    <div class="card">
      <div class="muted">Events</div>
      <div class="metric" id="events">0</div>
    </div>

    <div class="card">
      <div class="muted">Anomalies</div>
      <div class="metric" id="anomalies">0</div>
    </div>

    <div class="card">
      <div class="muted">Drift events</div>
      <div class="metric" id="drifts">0</div>
    </div>

    <div class="card">
      <div class="muted">Active alerts</div>
      <div class="metric" id="alerts">0</div>
    </div>

    <div class="card">
      <div class="muted">Predictive warnings</div>
      <div class="metric" id="predictions">0</div>
    </div>
  </div>

  <h2>Observed signal and short-term forecast</h2>

  <div id="monitoringChart" style="height: 320px; margin-bottom: 18px;"></div>

  <button id="generateInsights" type="button">Generate insights</button>

  <h2>Recent events and alerts</h2>

  <div class="card" id="eventList">
    No events yet.
  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>
    async function refresh() {
      try {
        const response = await fetch("/api/dashboard");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Dashboard request failed"
          );
        }

        document.getElementById("events").textContent =
          data.summary.event_count;

        document.getElementById("anomalies").textContent =
          data.summary.anomaly_count;

        document.getElementById("drifts").textContent =
          data.summary.drift_count;

        document.getElementById("alerts").textContent =
          data.summary.active_alert_count;

        document.getElementById("predictions").textContent =
          data.summary.predictive_warning_count;

        if (data.monitoring_figure && data.monitoring_figure.data && data.monitoring_figure.data.length) {
          Plotly.newPlot("monitoringChart", data.monitoring_figure.data, data.monitoring_figure.layout, {responsive: true});
        }

        const list = document.getElementById("eventList");

        if (!data.events.length) {
          list.textContent = "No events yet.";
          return;
        }

        list.replaceChildren();

        data.events
          .slice()
          .reverse()
          .slice(0, 30)
          .forEach(event => {
            const item = document.createElement("div");
            item.className = "event";

            const title = document.createElement("strong");

            title.textContent =
              `${event.model_name || "model"} · ` +
              `${event.alert?.severity || "unknown"} · ` +
              `${event.alert?.alert_type || "event"}`;

            if (event.alert?.severity === "critical") {
              title.className = "critical";
            } else if (event.alert?.severity === "warning") {
              title.className = "warning";
            }

            const details = document.createElement("pre");

            details.textContent = JSON.stringify({
              timestamp: event.timestamp,
              metrics: event.metrics,
              signals: event.signals,
              prediction: event.prediction,
              diagnosis: event.diagnosis,
              alert: event.alert
            }, null, 2);

            item.append(title, details);
            list.append(item);
          });

      } catch (error) {
        document.getElementById("eventList").textContent =
          error.message;
      }
    }

    document.getElementById("generateInsights").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/dashboard/insights", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({})
        });
        const data = await response.json();
        const insight = document.createElement("pre");
        insight.textContent = response.ok ? data.insight : data.error || "Could not load insights";
        const list = document.getElementById("eventList");
        list.appendChild(insight);
      } catch (error) {
        const list = document.getElementById("eventList");
        list.insertAdjacentHTML("beforeend", `<pre>${error.message}</pre>`);
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
